---
- name: Set Default label selector for custom resource generated postgres
  set_fact:
    postgres_label_selector: "app.kubernetes.io/instance=postgres-{{ supported_pg_version }}-{{ deployment_name }}"
  when: postgres_label_selector is not defined

- block:
    - name: Get the postgres pod information
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: '{{ ansible_operator_meta.namespace }}'
        label_selectors:
          - "{{ postgres_label_selector }}"
      register: postgres_pod
      until:
        - "postgres_pod['resources'] | length"
        - "postgres_pod['resources'][0]['status']['phase'] == 'Running'"
        - "postgres_pod['resources'][0]['status']['containerStatuses'][0]['ready'] == true"
      delay: 5
      retries: 60
    - name: Set the resource pod name as a variable.
      set_fact:
        postgres_pod_name: "{{ postgres_pod['resources'][0]['metadata']['name'] }}"
  when: awx_postgres_type == 'managed'

- name: Check for presence of AWX Deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ deployment_name }}-task"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: this_deployment

- name: Scale down Deployment for migration
  kubernetes.core.k8s_scale:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
    replicas: 0
    wait: yes
  loop:
    - "{{ deployment_name }}-task"
    - "{{ deployment_name }}-web"
  when: this_deployment['resources'] | length

- name: Set resolvable_db_host
  set_fact:
    resolvable_db_host: '{{ (awx_postgres_type == "managed") | ternary(awx_postgres_host + "." + ansible_operator_meta.namespace + ".svc." + cluster_name, awx_postgres_host) }}'  # yamllint disable-line rule:line-length
  no_log: "{{ no_log }}"

- name: Set pg_isready command
  ansible.builtin.set_fact:
    pg_isready: >-
      pg_isready
      -h {{ resolvable_db_host }}
      -p {{ awx_postgres_port }}
  no_log: "{{ no_log }}"

# pg_restore --clean cannot clean a database that already has AWX's schema:
# dropping the partitioned job event tables fails with "cannot drop inherited
# constraint". So a restore into an existing instance, or the retry of a
# restore that failed halfway, would fail. The operator owns the managed
# database, so it drops and recreates it and restores into the empty
# database. An external (unmanaged) database is only dropped with
# force_drop_db, as before.
- name: Decide whether to drop and recreate the database
  set_fact:
    restore_recreate_db: "{{ force_drop_db | bool or awx_postgres_type == 'managed' }}"

- name: Set pg_restore command
  set_fact:
    pg_restore: >-
      pg_restore {{ restore_recreate_db | bool | ternary('', '--clean --if-exists') }} --no-owner --no-acl
      -U {{ awx_postgres_user }}
      -h {{ resolvable_db_host }}
      -d {{ awx_postgres_database }}
      -p {{ awx_postgres_port }}
  no_log: "{{ no_log }}"

- name: Grant CREATEDB privilege to database user to recreate the database
  kubernetes.core.k8s_exec:
    namespace: "{{ ansible_operator_meta.namespace }}"
    pod: "{{ postgres_pod_name }}"
    container: postgres
    command: >-
      psql -v ON_ERROR_STOP=1 -c "ALTER USER \"{{ awx_postgres_user }}\" CREATEDB;"
  when:
    - restore_recreate_db | bool
    - awx_postgres_type == 'managed'

- name: Drop and create the database before restoring
  block:
    # IF EXISTS: a restore that failed between the drop and the create can be
    # retried. FORCE ends the connections that are left.
    - name: Set drop db command
      set_fact:
        pg_drop_db: >-
          PGPASSWORD='{{ awx_postgres_pass }}' psql -v ON_ERROR_STOP=1
          -U {{ awx_postgres_user }}
          -h {{ resolvable_db_host }}
          -d postgres
          -p {{ awx_postgres_port }}
          -c 'DROP DATABASE IF EXISTS \"{{ awx_postgres_database }}\" WITH (FORCE);' ;
      no_log: "{{ no_log }}"

    - name: Set create db command
      set_fact:
        pg_create_db: >-
          PGPASSWORD='{{ awx_postgres_pass }}' psql -v ON_ERROR_STOP=1
          -U {{ awx_postgres_user }}
          -h {{ resolvable_db_host }}
          -d postgres
          -p {{ awx_postgres_port }}
          -c 'CREATE DATABASE \"{{ awx_postgres_database }}\" WITH OWNER = \"{{ awx_postgres_user }}\";' ;
      no_log: "{{ no_log }}"

    - name: Set complete pg restore command
      set_fact:
        pg_drop_create: >-
          {{ pg_drop_db }}
          {{ pg_create_db }}
  when: restore_recreate_db | bool

- name: Restore Postgres database
  kubernetes.core.k8s_exec:
    namespace: "{{ backup_pvc_namespace }}"
    pod: "{{ ansible_operator_meta.name }}-db-management"
    container: "{{ ansible_operator_meta.name }}-db-management"
    command: |
      bash -c "
      function end_keepalive {
        rc=$?
        rm -f \"$1\"
        kill $(cat /proc/$2/task/$2/children 2>/dev/null) 2>/dev/null || true
        wait $2 || true
        exit $rc
      }
      keepalive_file=\"$(mktemp)\"
      until {{ pg_isready }} &> /dev/null
      do
          echo \"Waiting until Postgres is accepting connections...\"
          sleep 2
      done
      while [[ -f \"$keepalive_file\" ]]; do
        echo 'Migrating data from old database...'
        sleep 60
      done &
      keepalive_pid=$!
      trap 'end_keepalive \"$keepalive_file\" \"$keepalive_pid\"' EXIT SIGINT SIGTERM
      echo keepalive_pid: $keepalive_pid
      set -e -o pipefail
      {{ pg_drop_create }}
      PGPASSWORD='{{ awx_postgres_pass }}' {{ pg_restore }} {{ backup_dir }}/tower.db
      PG_RC=$?
      set +e +o pipefail
      exit $PG_RC
      "
  register: data_migration
  no_log: "{{ no_log }}"

- name: Revoke CREATEDB privilege from database user
  kubernetes.core.k8s_exec:
    namespace: "{{ ansible_operator_meta.namespace }}"
    pod: "{{ postgres_pod_name }}"
    container: postgres
    command: >-
      psql -v ON_ERROR_STOP=1 -c "ALTER USER \"{{ awx_postgres_user }}\" NOCREATEDB;"
  when:
    - restore_recreate_db | bool
    - awx_postgres_type == 'managed'
