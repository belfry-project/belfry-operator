<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4e"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf5"/>
      <stop offset="1" stop-color="#c3cbdb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2f62d6"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e9a521"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- signal arcs radiating from the bell -->
  <g fill="none" stroke="#ffd76a" stroke-linecap="round">
    <path d="M150 214 A 120 120 0 0 0 150 334" stroke-width="10" opacity=".55"/>
    <path d="M118 190 A 155 155 0 0 0 118 358" stroke-width="10" opacity=".3"/>
    <path d="M362 214 A 120 120 0 0 1 362 334" stroke-width="10" opacity=".55"/>
    <path d="M394 190 A 155 155 0 0 1 394 358" stroke-width="10" opacity=".3"/>
  </g>

  <!-- spire -->
  <path d="M256 66 L322 170 L190 170 Z" fill="url(#roof)"/>
  <rect x="250" y="44" width="12" height="30" rx="4" fill="#ffd76a"/>
  <circle cx="256" cy="44" r="8" fill="#ffd76a"/>

  <!-- cornice -->
  <rect x="178" y="166" width="156" height="18" rx="4" fill="#9aa6bf"/>

  <!-- tower body with arched belfry opening -->
  <path fill="url(#stone)" fill-rule="evenodd"
        d="M190 184 H322 V440 H190 Z
           M214 330 V246 A42 42 0 0 1 298 246 V330 Z"/>

  <!-- bell -->
  <rect x="252" y="222" width="8" height="12" rx="3" fill="#b7791f"/>
  <path d="M256 230 C232 230 228 254 228 276 C228 294 222 302 214 310 H298 C290 302 284 294 284 276 C284 254 280 230 256 230 Z" fill="url(#bell)"/>
  <circle cx="256" cy="318" r="9" fill="#e9a521"/>

  <!-- ledge under opening -->
  <rect x="204" y="330" width="104" height="12" rx="3" fill="#9aa6bf"/>

  <!-- door -->
  <path d="M238 440 V398 A18 18 0 0 1 274 398 V440 Z" fill="#1b2a4e"/>

  <!-- ground -->
  <rect x="150" y="436" width="212" height="12" rx="6" fill="#4f8cff" opacity=".6"/>
</svg>
