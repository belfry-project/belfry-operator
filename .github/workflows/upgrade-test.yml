---

name: Upgrade from AWX

# Installs AWX 24.6.1 with awx-operator 2.19.1 (PostgreSQL 15), creates data
# and backs it up with an AWXBackup. Then switches to belfry-operator on the
# same AWX resource and checks that the data survived, that the operator
# migrated the managed database to PostgreSQL 18 and that new jobs work. The
# "belfry-operator-1.0.0" variant first upgrades to belfry-operator 1.0.0
# (still PostgreSQL 15, with NetworkPolicies) and checks the data there.
# Then backs up the upgraded instance (PostgreSQL 18) and deletes it, restores
# the 24.6.1 backup into a new instance with an AWXRestore (which migrates the
# database to Belfry, on PostgreSQL 18), checks the same data there, deletes
# it, and restores the PostgreSQL 18 backup into a third instance. Finally
# restores that backup again into the third instance, as when a failed restore
# is retried, and checks the data once more. Last, restores a truncated copy of
# that backup into the third instance and checks that the failed restore did
# not leave the database user with CREATEDB.
#
# Inputs (workflow_dispatch and workflow_call; the schedule and pull requests
# use the defaults):
#   ref             Git ref of belfry-operator whose tests and deploy manifests
#                   (config/) are used. Default: the commit that triggered the
#                   run, or the default branch when called from another
#                   repository.
#   operator_image  belfry-operator image to switch to, e.g.
#                   ghcr.io/belfry-project/belfry-operator:1.0.0. Default: build
#                   one from the checkout, with DEFAULT_AWX_VERSION=awx_version.
#   awx_version     Belfry version the operator deploys by default, i.e. the
#                   tag of ghcr.io/belfry-project/belfry the upgraded and
#                   restored instances must run. Used as DEFAULT_AWX_VERSION
#                   when building the operator; with operator_image it must
#                   match that image's DEFAULT_AWX_VERSION. Default: main.
#
# A release workflow can run it with:
#   uses: belfry-project/belfry-operator/.github/workflows/upgrade-test.yml@<ref>
#   with: {ref: <tag>, operator_image: ..., awx_version: <version>}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref of belfry-operator to test (default the selected branch)
        type: string
        default: ''
      operator_image:
        description: belfry-operator image to switch to (default build from the checkout)
        type: string
        default: ''
      awx_version:
        description: Belfry version (image tag) the operator deploys by default
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        description: Git ref of belfry-operator to test (default the calling commit, or the default branch from another repository)
        type: string
        default: ''
      operator_image:
        description: belfry-operator image to switch to (default build from the checkout)
        type: string
        default: ''
      awx_version:
        description: Belfry version (image tag) the operator deploys by default
        type: string
        default: main
  schedule:
    - cron: '23 4 * * 1'
  pull_request:
    paths:
      - 'tests/upgrade/**'
      - '.github/workflows/upgrade-test.yml'
      # The database upgrade, backup and restore
      - 'roles/installer/tasks/database.yml'
      - 'roles/installer/tasks/upgrade_postgres.yml'
      - 'roles/installer/vars/main.yml'
      - 'roles/backup/**'
      - 'roles/restore/**'

permissions:
  contents: read

jobs:
  upgrade:
    name: upgrade (${{ matrix.from }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # What the instance runs before the switch to the tested operator
        from:
          - awx-operator-2.19.1
          - belfry-operator-1.0.0
    env:
      AWX_URL: http://localhost:8080
      RESTORED_URL: http://localhost:8081
      RESTORED_PG18_URL: http://localhost:8082
      # PostgreSQL major version of the databases the tested operator manages
      PG_VERSION: '18'
      OPERATOR_IMAGE: ${{ inputs.operator_image }}
      AWX_VERSION: ${{ inputs.awx_version || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: belfry-project/belfry-operator
          # github.sha belongs to the caller when called from another repository
          ref: ${{ inputs.ref || (github.repository == 'belfry-project/belfry-operator' && (github.event.pull_request.head.sha || github.sha)) || '' }}

      - name: Set up the test
        run: |
          # AWX checks out this commit as the project with the test playbook
          echo "PROJECT_BRANCH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BELFRY_IMAGE=ghcr.io/belfry-project/belfry:$AWX_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: upgrade

      - name: Install awx-operator 2.19.1 and AWX 24.6.1
        run: |
          kubectl apply -k tests/upgrade/awx-operator-2.19.1
          kubectl -n awx rollout status deployment/awx-operator-controller-manager --timeout=10m
          kubectl apply -f tests/upgrade/awx.yaml
          tests/upgrade/wait-for-awx.sh quay.io/ansible/awx:24.6.1

      - name: Create data in AWX 24.6.1
        run: |
          tests/upgrade/port-forward.sh awx 8080
          # A plain assignment fails the step if the password cannot be read
          password="$(tests/upgrade/admin-password.sh awx)"
          AWX_ADMIN_PASSWORD="$password" python tests/upgrade/check.py seed "$AWX_URL"

      - name: Back up AWX 24.6.1 with awx-operator 2.19.1
        run: |
          kubectl apply -f tests/upgrade/awxbackup.yaml
          tests/upgrade/wait-for-status.sh awxbackup awx-backup backupDirectory
          kubectl -n awx get awxbackup awx-backup -o jsonpath='{.status}{"\n"}'

      - name: Upgrade to belfry-operator 1.0.0
        if: matrix.from == 'belfry-operator-1.0.0'
        run: |
          git fetch --depth 1 origin tag 1.0.0
          git worktree add "$RUNNER_TEMP/operator-1.0.0" 1.0.0
          make -C "$RUNNER_TEMP/operator-1.0.0" deploy IMG=ghcr.io/belfry-project/belfry-operator:1.0.0
          kubectl -n awx rollout status deployment/awx-operator-controller-manager --timeout=10m
          tests/upgrade/wait-for-awx.sh ghcr.io/belfry-project/belfry:1.0.0
          tests/upgrade/check-postgres.sh awx 15
          kubectl -n awx get networkpolicies
          tests/upgrade/port-forward.sh awx 8080
          password="$(tests/upgrade/admin-password.sh awx)"
          AWX_ADMIN_PASSWORD="$password" python tests/upgrade/check.py verify "$AWX_URL"
          # verify ran a job that updated the cached facts
          echo FACTS_PHASE=after >> "$GITHUB_ENV"

      - name: Switch to belfry-operator
        run: |
          if [ -z "$OPERATOR_IMAGE" ]; then
            OPERATOR_IMAGE=belfry-operator:upgrade-test
            docker build --build-arg DEFAULT_AWX_VERSION="$AWX_VERSION" -t "$OPERATOR_IMAGE" .
            kind load docker-image --name upgrade "$OPERATOR_IMAGE"
          fi
          make deploy IMG="$OPERATOR_IMAGE"
          kubectl -n awx rollout status deployment/awx-operator-controller-manager --timeout=10m
          tests/upgrade/wait-for-awx.sh "$BELFRY_IMAGE"
          # The operator migrated the managed database to the new PostgreSQL
          # version and removed the old StatefulSet; the old PVC stays
          tests/upgrade/wait-for-status.sh awx awx upgradedPostgresVersion "$PG_VERSION"
          tests/upgrade/check-postgres.sh awx "$PG_VERSION"
          kubectl -n awx get pvc postgres-15-awx-postgres-15-0

      - name: Check the data and run jobs in Belfry
        run: |
          tests/upgrade/port-forward.sh awx 8080
          # A plain assignment fails the step if the password cannot be read
          password="$(tests/upgrade/admin-password.sh awx)"
          AWX_ADMIN_PASSWORD="$password" python tests/upgrade/check.py verify "$AWX_URL"

      - name: Back up the upgraded instance (PostgreSQL 18) with belfry-operator
        run: |
          kubectl apply -f tests/upgrade/awxbackup-pg18.yaml
          tests/upgrade/wait-for-status.sh awxbackup awx-backup-pg18 backupDirectory
          kubectl -n awx get awxbackup awx-backup-pg18 -o jsonpath='{.status}{"\n"}'

      - name: Delete the upgraded instance
        run: |
          # The restore must work from the backup alone, and the runner has
          # room for one instance at a time
          tests/upgrade/delete-instance.sh awx

      - name: Restore the AWX 24.6.1 backup with belfry-operator
        run: |
          kubectl apply -f tests/upgrade/awxrestore.yaml
          tests/upgrade/wait-for-status.sh awxrestore awx-restore restoreComplete true
          tests/upgrade/wait-for-awx.sh "$BELFRY_IMAGE" awx-restored
          # Set at the end of the operator's first reconciliation of the new instance
          tests/upgrade/wait-for-status.sh awx awx-restored adminPasswordSecret
          # The restore leaves no empty secrets behind (belfry-operator#24)
          kubectl -n awx get secrets -o custom-columns=NAME:.metadata.name,DATA:.data | tee /tmp/secrets.txt
          if grep -E '\s<none>$' /tmp/secrets.txt; then echo "Empty secrets after the restore" >&2; exit 1; fi
          # The operator migrated the restored 24.6.1 database with a Job for the Belfry image
          kubectl -n awx get jobs -o custom-columns=NAME:.metadata.name,SUCCEEDED:.status.succeeded | tee /tmp/jobs.txt
          grep -E '^awx-restored-migration-\S+\s+1$' /tmp/jobs.txt
          # The PostgreSQL 15 backup was restored into a PostgreSQL 18 database
          tests/upgrade/check-postgres.sh awx-restored "$PG_VERSION"

      - name: Check the data and run jobs in the restored instance
        run: |
          tests/upgrade/port-forward.sh awx-restored 8081
          # A plain assignment fails the step if the password cannot be read
          password="$(tests/upgrade/admin-password.sh awx-restored)"
          # The 24.6.1 backup was made before any job ran after the upgrade
          FACTS_PHASE=before AWX_ADMIN_PASSWORD="$password" python tests/upgrade/check.py verify "$RESTORED_URL"

      - name: Restore the PostgreSQL 18 backup with belfry-operator
        run: |
          tests/upgrade/delete-instance.sh awx-restored
          kubectl apply -f tests/upgrade/awxrestore-pg18.yaml
          tests/upgrade/wait-for-status.sh awxrestore awx-restore-pg18 restoreComplete true
          tests/upgrade/wait-for-awx.sh "$BELFRY_IMAGE" awx-restored-pg18
          tests/upgrade/wait-for-status.sh awx awx-restored-pg18 adminPasswordSecret
          kubectl -n awx get secrets -o custom-columns=NAME:.metadata.name,DATA:.data | tee /tmp/secrets.txt
          if grep -E '\s<none>$' /tmp/secrets.txt; then echo "Empty secrets after the restore" >&2; exit 1; fi
          tests/upgrade/check-postgres.sh awx-restored-pg18 "$PG_VERSION"

      - name: Check the data and run jobs in the instance restored from PostgreSQL 18
        run: |
          tests/upgrade/port-forward.sh awx-restored-pg18 8082
          password="$(tests/upgrade/admin-password.sh awx-restored-pg18)"
          # The backup was made after verify ran a job on the upgraded instance
          FACTS_PHASE=after AWX_ADMIN_PASSWORD="$password" python tests/upgrade/check.py verify "$RESTORED_PG18_URL"

      - name: Restore the PostgreSQL 18 backup again into the same instance
        run: |
          # The database has AWX's schema with the partitioned job event
          # tables, as when a restore that failed halfway is retried. A table
          # that is not in the backup shows that the restore replaced the
          # database instead of restoring over it.
          db="$(kubectl -n awx get secret awx-restored-pg18-postgres-configuration -o jsonpath='{.data.database}' | base64 -d)"
          kubectl -n awx exec awx-restored-pg18-postgres-$PG_VERSION-0 -c postgres -- \
            psql -v ON_ERROR_STOP=1 -d "$db" -c 'CREATE TABLE restore_retry_marker (id int)'
          kubectl apply -f tests/upgrade/awxrestore-pg18-retry.yaml
          tests/upgrade/wait-for-status.sh awxrestore awx-restore-pg18-retry restoreComplete true
          tests/upgrade/wait-for-awx.sh "$BELFRY_IMAGE" awx-restored-pg18
          # The restore scaled the instance down; the operator scales it up again
          for deployment in awx-restored-pg18-web awx-restored-pg18-task; do
            kubectl -n awx wait "deployment/$deployment" --for=jsonpath='{.status.readyReplicas}'=1 --timeout=20m
          done
          tests/upgrade/check-postgres.sh awx-restored-pg18 "$PG_VERSION"
          marker="$(kubectl -n awx exec awx-restored-pg18-postgres-$PG_VERSION-0 -c postgres -- \
            psql -tA -d "$db" -c "SELECT to_regclass('public.restore_retry_marker')")"
          if [ -n "$marker" ]; then echo "The restore did not replace the database" >&2; exit 1; fi

      - name: Check the data and run jobs after restoring into the same instance again
        run: |
          tests/upgrade/port-forward.sh awx-restored-pg18 8082
          password="$(tests/upgrade/admin-password.sh awx-restored-pg18)"
          FACTS_PHASE=after AWX_ADMIN_PASSWORD="$password" python tests/upgrade/check.py verify "$RESTORED_PG18_URL"

      - name: Check that a failed restore revokes CREATEDB
        run: |
          # Last: the failed restore leaves the instance without its data
          tests/upgrade/check-failed-restore.sh awx-backup-pg18 awx-restored-pg18 "$PG_VERSION"

      - name: Show the cluster state on failure
        if: failure()
        run: |
          for restore in $(kubectl -n awx get awxrestore -o name); do
            if [ "$(kubectl -n awx get "$restore" -o jsonpath='{.status.restoreComplete}')" != true ]; then
              tests/upgrade/debug-restore.sh "${restore#*/}" || true
            fi
          done
          set -x
          kubectl -n awx get awx,awxbackup,awxrestore,deployments,statefulsets,pods,jobs,pvc -o wide || true
          kubectl -n awx get awxbackup,awxrestore -o yaml || true
          kubectl -n awx get awx -o jsonpath='{range .items[*]}{.metadata.name}: {.status}{"\n"}{end}' || true
          kubectl -n awx get networkpolicies,secrets || true
          kubectl -n awx get events --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n awx describe pods || true
          # The operator's playbook output, without the proxy's cache messages
          kubectl -n awx logs deployment/awx-operator-controller-manager -c awx-manager \
            | grep -v -e '"logger":"proxy"' | tail -1500 || true
          for pod in $(kubectl -n awx get pods -o name | grep -E 'db-management|migration|postgres'); do
            kubectl -n awx logs "$pod" --all-containers --tail=200 || true
          done
          for instance in awx awx-restored awx-restored-pg18; do
            if kubectl -n awx get deployment "$instance-web" > /dev/null 2>&1; then
              case "$instance" in
                awx) url="$AWX_URL" ;;
                awx-restored) url="$RESTORED_URL" ;;
                *) url="$RESTORED_PG18_URL" ;;
              esac
              tests/upgrade/debug-auth.sh "$instance" "$url" || true
            fi
            kubectl -n awx logs "deployment/$instance-web" --all-containers --tail=200 || true
            kubectl -n awx logs "deployment/$instance-task" --all-containers --tail=200 || true
          done
