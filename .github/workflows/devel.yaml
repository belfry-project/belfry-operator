---

name: Devel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each architecture is built on a native runner and pushed as <sha>-<arch>.
  # The merge job combines them into the multi-arch :<sha> and :main tags.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-latest, suffix: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64}
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Log into registry ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567    # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to ghcr.io
        run: |
          BUILD_ARGS="--label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }}" \
          PLATFORMS=${{ matrix.platform }} \
          IMG=${IMAGE}:${{ github.sha }}-${{ matrix.suffix }} make docker-buildx
          # make docker-buildx ignores build errors, so check that the image exists
          docker buildx imagetools inspect ${IMAGE}:${{ github.sha }}-${{ matrix.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    name: Publish multi-arch tags
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567    # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image as <sha> and main
        run: |
          # Manual runs on other branches only publish <sha>
          tags="--tag ${IMAGE}:${{ github.sha }}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="${tags} --tag ${IMAGE}:main"
          fi
          docker buildx imagetools create ${tags} \
            --annotation="index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            ${IMAGE}:${{ github.sha }}-amd64 ${IMAGE}:${{ github.sha }}-arm64
          docker buildx imagetools inspect ${IMAGE}:${{ github.sha }}

      - name: Get the image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Signed statement of which repository, commit and workflow built the image.
      # Verify with: gh attestation verify oci://<image> --owner belfry-project
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
