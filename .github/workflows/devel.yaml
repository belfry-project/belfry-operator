---

name: Devel

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Push main image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Log into registry ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567    # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to ghcr.io
        run: |
          BUILD_ARGS="--label org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
          IMG=ghcr.io/${{ github.repository }}:${{ github.sha }} make docker-buildx

      - name: Tag image as main
        run: |
          docker buildx imagetools create \
            ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository }}:main
