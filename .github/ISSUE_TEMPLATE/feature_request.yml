---
name: ✨ Feature request
description: Suggest an idea for this project
body:
  - type: markdown
    attributes:
      value: |
        Feature Request issues are for **feature requests** only.
        For questions and help with installing, migrating from AWX or upgrading, see the [Belfry documentation](https://belfry-project.github.io/docs/).
        Never report a security vulnerability in a public issue: report it privately as described in
        [SECURITY.md](https://github.com/belfry-project/.github/blob/main/SECURITY.md), through
        [a private security advisory](https://github.com/belfry-project/belfry-operator/security/advisories/new).

  - type: checkboxes
    id: terms
    attributes:
      label: Please confirm the following
      options:
        - label: I agree to follow this project's [code of conduct](https://github.com/belfry-project/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: I have checked the [current issues](https://github.com/belfry-project/belfry-operator/issues) for duplicates.
          required: true
        - label: I understand that the Belfry Operator is open source software provided for free and that I might not receive a timely response.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Briefly describe the desired enhancement.
    validations:
      required: true
